<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выполнение целей по сегментам · XS · L · M · Private</title>
<style>
  :root{
    --bg:#0E141D; --panel:#18212E; --panel2:#141C27; --panel-hi:#213247;
    --ink:#E9EEF4; --muted:#8B99AC;
    --line:#263140; --line2:#212C3A; --rule:#334254;
    --fact:#57A5F2; --plan:#7E8DA1;
    --pos:#3AD07E; --neg:#F26B60;
    --posbg:rgba(58,208,126,.14); --negbg:rgba(242,107,96,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; line-height:1.4; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
    background-image:radial-gradient(1100px 380px at 78% -8%, rgba(87,165,242,.10), transparent 70%);
    background-attachment:fixed;}
  .sheet{max-width:1200px; margin:24px auto 56px; padding:0 20px}

  header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    padding:22px 26px; background:linear-gradient(180deg,#1B2635,#161F2C); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); margin-bottom:18px; animation:fadeUp .5s ease both}
  header.top h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.01em}
  header.top .sub{margin-top:4px; color:var(--muted); font-size:13px}
  .legend{display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
  .legend .it{display:flex; align-items:center; gap:7px; white-space:nowrap}
  .lg-fact{width:22px; height:0; border-top:2.5px solid var(--fact)}
  .lg-plan{width:22px; height:0; border-top:2px dashed var(--plan)}
  .lg-gap{display:inline-flex; gap:3px}
  .lg-gap i{width:3px; height:13px; display:block; border-radius:1px}

  .band{background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:20px 22px 18px; margin-bottom:18px; break-inside:avoid;
    animation:fadeUp .55s ease both}
  .band:nth-of-type(1){animation-delay:.06s}
  .band:nth-of-type(2){animation-delay:.14s}
  .band:nth-of-type(3){animation-delay:.22s}
  .band-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:2px}
  .band-title{display:flex; align-items:baseline; gap:12px}
  .band-idx{font-size:13px; font-weight:700; color:#0E141D; background:var(--fact); width:24px; height:24px;
    border-radius:7px; display:inline-flex; align-items:center; justify-content:center; align-self:center; font-variant-numeric:normal}
  .band-title h2{margin:0; font-size:17px; font-weight:650}
  .band-roll{font-size:13px; color:var(--muted)}
  .band-roll b{font-size:15px; color:var(--ink); font-weight:700; margin-left:2px}
  .unit-note{color:var(--muted); font-size:12px; margin:4px 0 4px}
  .hint{color:var(--fact); font-size:12px; margin:0 0 14px; display:flex; align-items:center; gap:6px; opacity:.92}
  .hint svg{width:13px;height:13px}

  .charts{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
  .chart{border:1px solid var(--line2); border-radius:11px; padding:10px 8px 6px; background:var(--panel2)}
  .chart.clickable{cursor:pointer;
    transition:opacity .28s ease, filter .28s ease, background .28s ease, box-shadow .22s ease, border-color .22s ease, transform .06s ease}
  .chart.clickable:hover{border-color:#33628f; box-shadow:0 6px 20px rgba(87,165,242,.16)}
  .chart.clickable:active{transform:translateY(1px)}
  /* selection: chosen chart lifts to a lighter background, siblings dim */
  .charts.has-selection .chart.clickable:not(.selected){opacity:.34; filter:saturate(.55) brightness(.72)}
  .chart.selected{background:var(--panel-hi);
    border-color:var(--fact); box-shadow:0 0 0 1px var(--fact), 0 10px 30px rgba(87,165,242,.30)}
  .chart .c-head{display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 4px}
  .chart .c-seg{font-weight:650; font-size:13px; display:flex; align-items:center; gap:5px}
  .chart .c-seg .chev{color:var(--muted); font-size:11px; transition:transform .2s ease, color .2s ease}
  .chart.selected .c-seg .chev{transform:rotate(90deg); color:var(--fact)}
  .chart .c-att{font-size:12px; font-weight:700}
  .chart svg{display:block; width:100%; height:auto}

  /* chart draw-in animations */
  .factline{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1s ease .12s forwards}
  .planline{opacity:0; animation:fadeIn .6s ease .05s forwards}
  .gaptick{opacity:0; animation:tickIn .5s ease .5s forwards}
  .dot{opacity:0; animation:fadeIn .4s ease .72s forwards}

  .detailwrap{display:none; margin-top:14px}
  .detailwrap.open{display:block; animation:expand .28s ease}
  .detail-inner{border:1px solid #2A3A4D; background:linear-gradient(180deg,#1C2836,#182333);
    border-radius:12px; padding:14px 16px 16px}
  .detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .detail-head .t{font-size:13.5px; font-weight:650}
  .detail-head .t b{color:var(--fact)}
  .detail-head .t .m{color:var(--muted); font-weight:400}
  .detail-close{border:1px solid var(--rule); background:#243244; color:var(--muted); font-size:12px;
    padding:4px 10px; border-radius:7px; cursor:pointer; transition:.18s}
  .detail-close:hover{color:var(--ink); border-color:#3d5169; background:#2a3a4e}
  .c-year{font-size:12px; font-weight:700; padding:1px 4px 8px}
  .charts.two{grid-template-columns:repeat(2,1fr)}
  .charts.two .chart{background:#15202D}

  table{width:100%; border-collapse:collapse; margin-top:16px; font-size:13px}
  caption{caption-side:top; text-align:left; color:var(--muted); font-size:12px; padding:0 0 6px}
  th,td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--muted); font-weight:600; font-size:12px; border-bottom:1px solid var(--rule)}
  tbody tr{transition:background .15s} tbody tr:hover{background:rgba(255,255,255,.02)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.total td{border-top:1.5px solid var(--rule); font-weight:700; background:rgba(255,255,255,.035)}
  .seg-name{font-weight:600}
  td.wt{font-weight:600; color:#C4CEDA}
  .wtrack{height:5px; background:#26313F; border-radius:3px; margin:4px 0 0; width:120px; margin-left:auto}
  .wfill{height:5px; border-radius:3px; background:#5C6E85; transition:width .6s ease}
  .num{font-variant-numeric:tabular-nums}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  .pill{display:inline-block; min-width:66px; text-align:center; padding:2px 8px; border-radius:6px; font-weight:700}
  .pill.pos{background:var(--posbg)} .pill.neg{background:var(--negbg)}

  footer.note{color:var(--muted); font-size:11.5px; margin:6px 2px 0; line-height:1.5}

  .totalchart{border:1px solid #2C3A4C; border-radius:12px; padding:14px 16px 10px; margin:2px 0 18px;
    background:linear-gradient(180deg,#1B2637,#172130); box-shadow:inset 0 0 0 1px rgba(87,165,242,.05)}
  .tc-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:2px}
  .tc-title{font-size:14px; font-weight:700; display:flex; flex-direction:column; gap:2px}
  .tc-title .tc-sub{font-size:11.5px; font-weight:400; color:var(--muted)}
  .tc-att{font-size:19px; font-weight:800; white-space:nowrap}
  .totalchart svg{width:100%; height:auto}
  .breakdown{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 2px 12px}
  .bd-title{font-size:13px; font-weight:650; color:#C4CEDA}
  .bd-hint{color:var(--fact); font-size:12px; display:flex; align-items:center; gap:6px; opacity:.92}
  .bd-hint svg{width:13px;height:13px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes tickIn{to{opacity:.6}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes expand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  @media (max-width:900px){ .charts{grid-template-columns:repeat(2,1fr)} header.top{flex-direction:column; align-items:flex-start} }
  @media (max-width:520px){ .charts{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
    .factline{stroke-dashoffset:0} .planline,.dot{opacity:1} .gaptick{opacity:.6}
  }
  @media print{ body{background:#fff;color:#000} .sheet{margin:0 auto;max-width:none} .hint{display:none} }
</style>
</head>

const MONTHS = DATA.months;
const SEGS = ["XS","L","M","Private"];
const METRIC_NAME = {revenue:"Выручка", items:"Items Net", marketshare:"Market share"};

const comma = s => String(s).replace(".",",");
function sign(n){ return n>0?"+":(n<0?"−":""); }
function fmtPct(n,dec=1){ return sign(n)+comma(Math.abs(n).toFixed(dec))+"%"; }
function ruInt(n){ return Math.round(Math.abs(n)).toLocaleString("ru-RU").replace(/\u00A0/g," "); }
function fmtMoney(n){ return sign(n)+ruInt(n)+" ₽"; }
function fmtUnits(n){ return sign(n)+ruInt(n)+" шт"; }
function fmtPP(n,dec=2){ return sign(n)+comma(Math.abs(n).toFixed(dec))+" пп"; }
function fmtWeight(n){ return comma(n.toFixed(1))+"%"; }
function lagRevenue(v){ return "("+sign(v)+comma((Math.abs(v)/1e6).toFixed(1))+")"; }
function lagItems(v){   return "("+sign(v)+comma((Math.abs(v)/1e3).toFixed(1))+")"; }
function lagShare(v){   return "("+sign(v)+comma(Math.abs(v).toFixed(1))+")"; }
const LAGFN = {revenue:lagRevenue, items:lagItems, marketshare:lagShare};
function cls(v){ return v>=0?"pos":"neg"; }
function attain(f,t){ return f/t*100; }
function sum(a){ return a.reduce((x,y)=>x+y,0); }

function chart(fact, plan, lagLabels, big){
  const W=big?980:280, H=big?300:182;
  const L=big?18:10, R=big?18:10, T=big?18:14, B=big?66:54;
  const x0=L, x1=W-R, y0=T, y1=H-B, n=fact.length, step=(x1-x0)/(n-1);
  const monthF=big?14:10, lagF=big?12.5:9.2, off1=big?24:16, off2=big?44:29;
  const tickW=big?3.2:2.4, dotF=big?3.8:2.6, dotP=big?3.1:2.2, factW=big?3:2.4, planW=big?2.2:1.8, dash=big?"7 5":"5 4";
  const all=fact.concat(plan); let mn=Math.min(...all), mx=Math.max(...all);
  const pad=(mx-mn)*0.12 || 1; mn-=pad; mx+=pad;
  const X=i=>x0+step*i, Y=v=>y1-(v-mn)/(mx-mn)*(y1-y0);
  const path=arr=>arr.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  let ticks="",dotsF="",dotsP="",xlab="";
  for(let i=0;i<n;i++){
    const fy=Y(fact[i]), py=Y(plan[i]);
    const c = fact[i]>=plan[i] ? "var(--pos)" : "var(--neg)";
    ticks+=`<line class="gaptick" x1="${X(i).toFixed(1)}" y1="${py.toFixed(1)}" x2="${X(i).toFixed(1)}" y2="${fy.toFixed(1)}" stroke="${c}" stroke-width="${tickW}"/>`;
    dotsF+=`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${fy.toFixed(1)}" r="${dotF}" fill="var(--fact)"/>`;
    dotsP+=`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${py.toFixed(1)}" r="${dotP}" fill="var(--panel2)" stroke="var(--plan)" stroke-width="1.3"/>`;
    const lag=lagLabels[i], lc=lag.startsWith("(−")?"var(--neg)":(lag.startsWith("(+")?"var(--pos)":"var(--muted)");
    xlab+=`<text x="${X(i).toFixed(1)}" y="${y1+off1}" text-anchor="middle" font-size="${monthF}" fill="var(--muted)">${MONTHS[i]}</text>`;
    xlab+=`<text x="${X(i).toFixed(1)}" y="${y1+off2}" text-anchor="middle" font-size="${lagF}" fill="${lc}">${lag}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">
    <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="var(--line)" stroke-width="1"/>
    ${ticks}
    <path class="planline" d="${path(plan)}" fill="none" stroke="var(--plan)" stroke-width="${planW}" stroke-dasharray="${dash}" stroke-linejoin="round"/>
    <path class="factline" pathLength="1" d="${path(fact)}" fill="none" stroke="var(--fact)" stroke-width="${factW}" stroke-linejoin="round"/>
    ${dotsP}${dotsF}${xlab}</svg>`;
}

function attLabel(metric, f, p){
  if(metric==="marketshare"){ const a=f[7]-p[7]; return [a, fmtPP(a,1)]; }
  const a=attain(sum(f),sum(p))-100; return [a, fmtPct(a)];
}
function lagsFor(metric, f, p, diff){
  return metric==="marketshare" ? diff.map(v=>LAGFN[metric](v)) : f.map((v,i)=>LAGFN[metric](v-p[i]));
}
function segChart(metric, s){
  const md=DATA[metric][s]; const [a,at]=attLabel(metric, md.Fact, md.Target);
  const lags=lagsFor(metric, md.Fact, md.Target, md.Diff);
  return `<div class="chart clickable" data-metric="${metric}" data-seg="${s}">
    <div class="c-head"><span class="c-seg"><span class="chev">▸</span>${s}</span><span class="c-att ${cls(a)}">${at}</span></div>
    ${chart(md.Fact, md.Target, lags)}</div>`;
}
function yearGap(metric, md){
  if(metric==="marketshare"){
    const arr=md.Diff||[]; const avg=arr.reduce((x,y)=>x+y,0)/(arr.length||1);
    return [avg, (avg<0?"Не хватает доли за год: ":"Опережение доли за год: ")+fmtPP(avg,1)+" (в среднем)"];
  }
  const v=sum(md.Fact)-sum(md.Target);
  const val = metric==="revenue" ? sign(v)+comma((Math.abs(v)/1e6).toFixed(1))+" млн ₽" : sign(v)+ruInt(v)+" шт";
  return [v, (v<0?"Не хватает за год: ":"Опережение за год: ")+val];
}
function subChart(metric, seg, sub){
  const md=DATA.details[seg][sub][metric];
  const [a,at]=attLabel(metric, md.Fact, md.Target);
  const lags=lagsFor(metric, md.Fact, md.Target, md.Diff||[]);
  const [gv,gtext]=yearGap(metric, md);
  return `<div class="chart">
    <div class="c-head"><span class="c-seg">${sub}</span><span class="c-att ${cls(a)}">${at}</span></div>
    <div class="c-year ${cls(gv)}">${gtext}</div>
    ${chart(md.Fact, md.Target, lags)}</div>`;
}
function renderDetail(metric, seg){
  return `<div class="detail-inner">
    <div class="detail-head">
      <div class="t">Детализация · <b>${seg}</b> <span class="m">· ${METRIC_NAME[metric]} · разрез SS / SUB</span></div>
      <button class="detail-close" data-metric="${metric}">Скрыть ✕</button>
    </div>
    <div class="charts two">${subChart(metric,seg,"SS")}${subChart(metric,seg,"SUB")}</div>
  </div>`;
}
function totalChart(metric){
  const md=DATA.totals[metric];
  const [a,at]=attLabel(metric, md.Fact, md.Target);
  const lags=lagsFor(metric, md.Fact, md.Target, md.Diff||[]);
  const subt = metric==="marketshare" ? "Взвешенная доля по всем сегментам (по объёму рынка)" : "Сумма факта и плана по всем сегментам";
  return `<div class="totalchart">
    <div class="tc-head"><div class="tc-title">Итого по всем сегментам<span class="tc-sub">${subt}</span></div>
      <span class="tc-att ${cls(a)}">${at}</span></div>
    ${chart(md.Fact, md.Target, lags, true)}</div>`;
}
function pill(dev){ return `<span class="pill ${cls(dev)}">${fmtPct(dev)}</span>`; }
function totalRow(metric, fmt){
  let f=0,t=0; SEGS.forEach(s=>{f+=DATA.summary[metric][s].fact;t+=DATA.summary[metric][s].target;});
  const dev=(f/t-1)*100, ab=f-t;
  return `<tr class="total"><td>Итого</td><td class="wt">100,0%</td><td>${pill(dev)}</td><td class="num ${cls(ab)}">${fmt(ab)}</td></tr>`;
}
function buildBand(idx,title,unitNote,metric,tableCfg){
  const md=DATA[metric];
  let F=0,Tt=0; SEGS.forEach(s=>{F+=sum(md[s].Fact);Tt+=sum(md[s].Target);});
  const roll = metric==="marketshare"
     ? `Ср. доля факт ${comma((SEGS.reduce((a,s)=>a+md[s].Fact[7],0)/4).toFixed(1))}% против ${comma((SEGS.reduce((a,s)=>a+md[s].Target[7],0)/4).toFixed(1))}% плана`
     : `Итого по плану выполнено <b>${comma(attain(F,Tt).toFixed(1))}%</b>`;
  const charts = SEGS.map(s=>segChart(metric,s)).join("");
  const rows = SEGS.map(s=>{ const sm=DATA.summary[metric][s];
    return `<tr><td class="seg-name">${s}</td>
      <td class="wt">${fmtWeight(sm.weight)}<div class="wtrack"><div class="wfill" style="width:${(sm.weight/40*100).toFixed(0)}%"></div></div></td>
      <td>${pill(sm.devpct)}</td>
      <td class="num ${cls(tableCfg.absVal(sm))}">${tableCfg.absFmt(tableCfg.absVal(sm))}</td></tr>`;}).join("");
  return `<section class="band">
    <div class="band-head"><div class="band-title"><span class="band-idx">${idx}</span><h2>${title}</h2></div>
      <div class="band-roll">${roll}</div></div>
    <div class="unit-note">${unitNote}</div>
    ${totalChart(metric)}
    <div class="breakdown"><span class="bd-title">Разбивка по сегментам</span><span class="bd-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>нажмите на сегмент, чтобы раскрыть SS / SUB</span></div>
    <div class="charts" id="charts-${metric}">${charts}</div>
    <div class="detailwrap" id="detail-${metric}"></div>
    <table><caption>${tableCfg.caption}</caption>
      <thead><tr><th>Сегмент</th><th>Вес в плане, %</th><th>Отклонение от плана, %</th><th>${tableCfg.absHead}</th></tr></thead>
      <tbody>${rows}${tableCfg.total?totalRow(metric,tableCfg.absFmt):""}</tbody></table>
  </section>`;
}

document.getElementById("app").innerHTML =
  buildBand(1,"Выручка (Revenue) · выполнение плана",
    "В скобках под каждым месяцем — отставание факта от плана за месяц, млн ₽.","revenue",

     absHead:"Отклонение, ₽", absVal:s=>s.absdiff, absFmt:fmtMoney, total:true})
  + buildBand(2,"Items Net · выполнение плана",
    "В скобках под каждым месяцем — отставание факта от плана за месяц, тыс. шт.","items",
    {caption:"Отклонение факта от плана нарастающим итогом за янв–авг 2026",
     absHead:"Отклонение, шт", absVal:s=>s.absdiff, absFmt:fmtUnits, total:true})
  + buildBand(3,"Market share · выполнение плана",
    "В скобках под каждым месяцем — отставание доли факта от плана за месяц, пп.","marketshare",
    {caption:"Отклонение доли от плана на август 2026; вес — доля сегмента в плановом объёме рынка (авг 2026)",
     absHead:"Отклонение, пп", absVal:s=>s.pp, absFmt:v=>fmtPP(v,2), total:false});

const openState={revenue:null, items:null, marketshare:null};
function setDetail(metric, seg){
  const wrap=document.getElementById("detail-"+metric);
  const grid=document.getElementById("charts-"+metric);
  const charts=grid.querySelectorAll(".chart.clickable");
  if(openState[metric]===seg){
    openState[metric]=null; wrap.classList.remove("open"); wrap.innerHTML="";
    grid.classList.remove("has-selection"); charts.forEach(c=>c.classList.remove("selected")); return;
  }
  openState[metric]=seg; wrap.innerHTML=renderDetail(metric,seg); wrap.classList.add("open");
  grid.classList.add("has-selection");
  charts.forEach(c=>c.classList.toggle("selected", c.dataset.seg===seg));
}
document.addEventListener("click",e=>{
  const close=e.target.closest(".detail-close");
  if(close){ setDetail(close.dataset.metric, openState[close.dataset.metric]); return; }
  const ch=e.target.closest(".chart.clickable");
  if(ch){ setDetail(ch.dataset.metric, ch.dataset.seg); }
});
